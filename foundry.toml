[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
cache = true
cache_path = 'cache'
gas_reports = ["MemeToken"]

# 启用作弊码
ffi = true

# 优化设置
optimizer = true
optimizer_runs = 200

# 测试配置
[fuzz]
runs = 256
max_test_rejects = 65536

# 测试报告
[fmt]
line_length = 120

# Gas报告
[invariant]
runs = 256
depth = 30